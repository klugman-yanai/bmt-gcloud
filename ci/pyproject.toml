[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-bmt"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
description = "Cloud Bench CI driver: matrix discovery, Cloud Run handoff, and runner upload."
dependencies = [
    "cloud-ci-handoff",
    "bmt-runtime",
    "google-cloud-compute>=1.45",
    "google-cloud-storage>=2.16",
    "PyGithub>=2.0",
    "pydantic>=2.12.5",
    "semver>=3.0",
    "typer>=0.15.0",
]

[tool.uv]
package = true

[project.scripts]
cloud-bmt = "cloud_bmt.driver:main"
cloud-bmt-matrix = "cloud_bmt.driver:main_matrix"
cloud-bmt-write-context = "cloud_bmt.driver:main_write_context"
cloud-bmt-write-summary = "cloud_bmt.driver:main_write_handoff_summary"
bmt = "cloud_bmt.driver:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloud_bmt*"]

[tool.setuptools.package-data]
cloud_bmt = ["resources/*.json"]
