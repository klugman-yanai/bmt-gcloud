[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bmt-sdk"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.12.5",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bmt_sdk*"]

[tool.setuptools.package-data]
bmt_sdk = ["py.typed"]
